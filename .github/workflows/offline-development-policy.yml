name: Offline Development Policy
on:
  pull_request:
    paths:
      - 'control/development-runtime-policy.v1.json'
      - 'docs/DEVELOPMENT_RELEASE_POLICY.md'
      - 'tests/governance/development-runtime-policy.test.mjs'
      - '.github/workflows/offline-development-policy.yml'
  push:
    branches: [main]
    paths:
      - 'control/development-runtime-policy.v1.json'
      - 'docs/DEVELOPMENT_RELEASE_POLICY.md'
      - 'tests/governance/development-runtime-policy.test.mjs'
      - '.github/workflows/offline-development-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-default-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/governance/development-runtime-policy.test.mjs
