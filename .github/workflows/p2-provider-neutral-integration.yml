name: P2 Provider-Neutral Scoped Integration (No Vercel)

on:
  pull_request:
    paths:
      - ".github/workflows/p2-provider-neutral-integration.yml"
      - "scripts/ci-p2-cross-service-smoke.mjs"
      - "tests/application/prompt-workflow-authority-pg-integration.test.ts"
      - "tests/governance/p2-provider-neutral-ci.test.mjs"
      - "control/execution-service-protocol.v1.json"
      - "control/private-execution-service-onboarding.v1.json"
      - "docs/ADR-VERCEL-FREE-EXECUTION-VALIDATION.proposed.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-p2-provider-neutral-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-preflight:
    name: P2 protocol and CI harness preflight (NOT E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate no-provider-required protocol and runner syntax
        run: |
          node --check scripts/ci-p2-cross-service-smoke.mjs
          node --test tests/governance/p2-provider-neutral-ci.test.mjs
          node scripts/check-execution-service-protocol.mjs
          node scripts/check-private-execution-services.mjs
          node --test tests/governance/execution-service-protocol.test.mjs tests/governance/private-execution-services.test.mjs
      - name: Clearly mark unverified runtime boundary
        run: echo "P2 contract preflight only; cross-private execution, canonical adoption, full E2E and Production are NOT VERIFIED."

  postgres-constraints:
    name: P3 isolated PostgreSQL migration and journal guards
    needs: contract-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_qa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_qa_test
      BLUEPRINT_QA_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Apply official migrations and check ledger in disposable DB
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm exec prisma validate --config prisma7.config.ts
          pnpm db:migrate:deploy
          pnpm db:migrate:status
      # Includes one real SHA-pinned source and independent readback under a
      # disposable test Owner and PostgreSQL. This is NOT authenticated
      # canonical Work Package authority or a completion receipt.
      - name: Real PostgreSQL immutable journal, roles and independent QA negatives
        run: pnpm exec vitest run tests/application/prompt-workflow-qa-pg-integration.test.ts tests/application/prompt-workflow-authority-pg-integration.test.ts

  cross-component-isolated:
    name: Private 3-service source + isolated PostgreSQL (CI smoke, NOT release)
    needs: [contract-preflight, postgres-constraints]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'BlueDragon33/Software-Blueprint-Hub'
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_qa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_qa_test
      BLUEPRINT_QA_DB_INTEGRATION: "true"
      GATEWAY_SHA: 77ba939787e6a8aa26edcf25e6ba1b6ba57e0a94
      WORKER_SHA: 6de12d9efb36052fd039e869797540d0f182bd66
      QA_SHA: 13208f42838685eaa76ce6cef9754ad622779cc3
    steps:
      - name: Checkout exact Hub source (never persist GITHUB_TOKEN)
        uses: actions/checkout@v5
        with:
          path: hub
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - name: Install exact Hub dependencies and migrate disposable PostgreSQL before issuing tokens
        working-directory: hub
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm exec prisma validate --config prisma7.config.ts
          pnpm db:migrate:deploy
          pnpm db:migrate:status
      - name: Issue selected-repository execution read token
        id: execution-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.BLUEPRINT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BLUEPRINT_GITHUB_APP_PRIVATE_KEY }}
          owner: BlueDragon33
          repositories: |
            Software-Blueprint-Hub
            Software-Blueprint-Execution-Gateway
            Software-Blueprint-Execution-Worker
            Software-Blueprint-QA-Worker
          permission-contents: read
      - name: Issue separate selected-repository QA read token
        id: qa-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.BLUEPRINT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BLUEPRINT_GITHUB_APP_PRIVATE_KEY }}
          owner: BlueDragon33
          repositories: |
            Software-Blueprint-Hub
            Software-Blueprint-Execution-Gateway
            Software-Blueprint-Execution-Worker
            Software-Blueprint-QA-Worker
          permission-contents: read
      - name: Check installation binding without exporting credentials
        env:
          EXPECTED_INSTALLATION: ${{ vars.BLUEPRINT_GITHUB_INSTALLATION_ID }}
          EXECUTION_INSTALLATION: ${{ steps.execution-token.outputs.installation-id }}
          QA_INSTALLATION: ${{ steps.qa-token.outputs.installation-id }}
        run: |
          node --input-type=module <<'JS'
          const { EXPECTED_INSTALLATION: expected, EXECUTION_INSTALLATION: execution, QA_INSTALLATION: qa } = process.env;
          if (!/^\d+$/.test(expected ?? '') || expected !== execution || expected !== qa) {
            throw new Error('Unexpected GitHub App installation');
          }
          JS
      - name: Checkout independently pinned private Gateway
        uses: actions/checkout@v5
        with:
          repository: BlueDragon33/Software-Blueprint-Execution-Gateway
          ref: 77ba939787e6a8aa26edcf25e6ba1b6ba57e0a94
          token: ${{ steps.execution-token.outputs.token }}
          path: gateway
          persist-credentials: false
      - name: Checkout independently pinned private Worker
        uses: actions/checkout@v5
        with:
          repository: BlueDragon33/Software-Blueprint-Execution-Worker
          ref: 6de12d9efb36052fd039e869797540d0f182bd66
          token: ${{ steps.execution-token.outputs.token }}
          path: worker
          persist-credentials: false
      - name: Checkout independently pinned private QA Worker
        uses: actions/checkout@v5
        with:
          repository: BlueDragon33/Software-Blueprint-QA-Worker
          ref: 13208f42838685eaa76ce6cef9754ad622779cc3
          token: ${{ steps.execution-token.outputs.token }}
          path: qa
          persist-credentials: false
      - name: Run all three independent repositories' existing scoped suites
        run: |
          (cd gateway && npm run ci)
          (cd worker && npm run ci)
          (cd qa && npm run ci)
      - name: Verify immutable canonical attempt and QA constraints with real PostgreSQL
        working-directory: hub
        run: pnpm exec vitest run tests/application/prompt-workflow-qa-pg-integration.test.ts tests/application/prompt-workflow-authority-pg-integration.test.ts
      - name: Signed Gateway -> Worker -> independently re-fetching QA (isolated CI fixture only)
        env:
          BLUEPRINT_EXECUTION_READ_TOKEN: ${{ steps.execution-token.outputs.token }}
          BLUEPRINT_QA_READ_TOKEN: ${{ steps.qa-token.outputs.token }}
        run: node hub/scripts/ci-p2-cross-service-smoke.mjs
      - name: Archive clearly scoped SHA-bound CI evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-component-smoke-not-authenticated-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/p2-provider-neutral-contract-evidence.json
          if-no-files-found: error
          retention-days: 7
