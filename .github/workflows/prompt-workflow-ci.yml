name: Central Prompt Workflow Integration CI

on:
  pull_request:
    paths:
      - "packages/application/src/prompt-workflow-*.mjs"
      - "packages/application/src/prompt-workflow-*.d.mts"
      - "packages/application/src/prompt-workflow-*.ts"
      - "packages/runtime/src/workflow-execution-journal.ts"
      - "packages/runtime/src/workflow-execution-authority.ts"
      - "packages/persistence/src/workflow-execution-authority-repository.ts"
      - "packages/runtime/src/workflow-scoped-github-executor.ts"
      - "packages/runtime/src/workflow-observation-qa.ts"
      - "packages/runtime/src/workflow-inspection-pipeline.ts"
      - "packages/runtime/src/workflow-inspection-qa-journal.ts"
      - "packages/runtime/src/workflow-inspection-qa-journal.ts"
      - "packages/runtime/src/index.ts"
      - "packages/runtime/src/issue-115-intake.ts"
      - "apps/web/app/projects/**/roadmap/**"
      - "docs/work-packages/issue-115-admission.payload.json"
      - "tests/application/issue-115-intake.test.ts"
      - "tests/e2e/issue-115-local-acceptance.pw.ts"
      - "packages/persistence/prisma/schema.prisma"
      - "packages/persistence/prisma/migrations/**"
      - "scripts/generate-prompt-workflow-imports.mjs"
      - "packages/application/src/index.ts"
      - "scripts/prompt-workflow-*.mjs"
      - "tests/application/prompt-workflow-*.test.ts"
      - "tests/prompt-workflows/**"
      - "apps/web/src/server/prompt-workflow.ts"
      - "apps/web/src/server/prompt-workflow-receipts.ts"
      - "apps/web/src/lib/hub-app-directory.ts"
      - "apps/web/app/_components/hub-*.tsx"
      - "apps/web/app/_components/hub-*.ts"
      - "apps/web/app/ecosystem/**"
      - "apps/web/app/settings/**"
      - "apps/web/app/page.tsx"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/globals.css"
      - "apps/web/app/projects/**/_components/**"
      - "apps/web/app/projects/**/blueprint/**"
      - "packages/ui/src/index.tsx"
      - "tests/application/hub-app-directory.test.ts"
      - "tests/web/hub-launcher.test.tsx"
      - "apps/web/src/auth/appmanage-sso.ts"
      - "apps/web/src/auth/server-actor.ts"
      - "apps/web/app/api/sso/**"
      - "apps/web/app/settings/**"
      - "packages/persistence/prisma/migrations/**"
      - "tests/application/appmanage-sso.test.ts"
      - "apps/web/app/projects/**/prompt/**"
      - "tests/web/workflow-studio.test.tsx"
      - "prompt-workflows/**"
      - ".github/workflows/prompt-workflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-workflow-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client for dependent web typecheck
        run: pnpm prisma:generate
      - name: Validate workflow manifests
        run: pnpm check:prompts
      - name: Workflow graph adversarial tests
        run: pnpm test:prompts
      - name: Typecheck durable persistence adapter
        run: pnpm --filter @blueprint-os/persistence typecheck && pnpm --filter @blueprint-os/runtime typecheck
      - name: Typecheck application adapter
        run: pnpm --filter @blueprint-os/application typecheck
      - name: Typecheck Next.js project workspace
        run: pnpm --filter @blueprint-os/web typecheck
      - name: Candidate projection authorization and drift tests
        run: pnpm exec vitest run tests/application/prompt-workflow-projection.test.ts tests/application/prompt-workflow-registry.test.ts tests/application/prompt-workflow-graph.test.ts tests/application/prompt-workflow-orchestration.test.ts tests/application/prompt-workflow-execution.test.ts tests/application/prompt-workflow-authority.test.ts tests/application/prompt-workflow-journal.test.ts tests/application/prompt-workflow-github-executor.test.ts tests/application/prompt-workflow-operational-e2e.test.ts tests/application/prompt-workflow-observation-qa.test.ts tests/application/prompt-workflow-inspection-pipeline.test.ts tests/application/prompt-workflow-qa-journal.test.ts tests/application/issue-115-intake.test.ts
      - name: Compile opt-in localhost acceptance Playwright tests (LIST ONLY; NOT E2E)
        run: pnpm exec playwright test tests/e2e/issue-115-local-acceptance.pw.ts --list
      - name: Visual Workflow Studio semantic SSR tests
        run: pnpm exec vitest run --config tests/web/workflow-studio.vitest.config.mts
      - name: Vietnamese launcher, app grouping and no-invented-deployment tests
        run: pnpm exec vitest run tests/application/hub-app-directory.test.ts tests/application/appmanage-sso.test.ts
