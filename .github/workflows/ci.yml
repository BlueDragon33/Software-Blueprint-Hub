name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies for FND-002 bootstrap
        run: pnpm install --no-frozen-lockfile

      - name: Generate typed contract projection
        run: pnpm contracts:generate

      - name: Bootstrap generated evidence
        run: |
          echo "===BLUEPRINT_PNPM_LOCKFILE_BEGIN==="
          cat pnpm-lock.yaml
          echo "===BLUEPRINT_PNPM_LOCKFILE_END==="
          echo "===BLUEPRINT_GENERATED_TYPES_BEGIN==="
          cat packages/contracts/src/generated/vertical-slice.ts
          echo "===BLUEPRINT_GENERATED_TYPES_END==="

      - name: Schema compatibility
        run: pnpm schema:compat

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build
