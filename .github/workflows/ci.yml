name: Development Fast CI

on:
  push:
    branches: [main, "foundation/**", "phase6/**", "phase7/**", "phase8/**", "phase9/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f prisma7.config.ts
          test -f packages/persistence/prisma/schema.prisma
          test -d apps
          test -d packages/persistence/prisma/migrations
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Universal Constitution compliance
        run: node scripts/check-constitution-adoption.mjs
      - name: Constitution authority-set atomicity
        run: node scripts/check-constitution-authority-set.mjs

      - name: Constitution ecosystem snapshot
        run: node scripts/check-constitution-ecosystem-snapshot.mjs

      - name: Constitution compliance matrix snapshot
        run: node scripts/check-constitution-compliance-snapshot.mjs

      - name: Derive current governed inventory without changing sealed baseline
        run: |
          node scripts/derive-governance-current-view.mjs --check
          node --test tests/governance/current-coverage.test.mjs
      - name: Test scoped live GitHub verification fail-closed
        run: node --test tests/governance/onboarding-live.test.mjs
      - name: Sealed constitution onboarding queue
        run: |
          node scripts/check-governance-onboarding-queue.mjs
          node --test tests/governance/onboarding-queue.test.mjs
      - name: Staged private execution services without implicit authority
        run: |
          node scripts/check-private-execution-services.mjs
          node --test tests/governance/private-execution-services.test.mjs
      - name: Execution departments ownership and split policy
        run: |
          node scripts/check-execution-departments.mjs
          node --test tests/governance/execution-departments.test.mjs
      - name: Source-of-truth contradiction gate
        run: node scripts/check-source-of-truth.mjs
      - name: Source-of-truth detector self-test
        run: node --test tests/source-truth/source-truth-detector.test.mjs
      - name: Agent change evidence candidate adversarial self-tests (proposal only)
        run: node --test tests/source-truth/agent-change-evidence-candidate.test.mjs
      - name: Inactive constitutional candidate and contrast negative tests
        run: |
          node --test tests/source-truth/constitution-1.3-candidate.test.mjs tests/source-truth/constitution-contrast.test.mjs
          node scripts/check-constitution-1.3-candidate.mjs
      - name: Central prompt workflow contract validation
        run: node scripts/check-prompt-workflows.mjs
      - name: Central prompt workflow adversarial regression
        run: node --test tests/prompt-workflows/workflow.test.mjs
      - name: Atlas and Next Action candidate negative/regression tests
        run: |
          node --test \
            tests/application/atlas-graph.candidate.test.mjs \
            tests/application/atlas-live-events.candidate.test.mjs \
            tests/application/atlas-next-action-adapter.candidate.test.mjs \
            tests/application/next-action-intake.candidate.test.mjs \
            tests/application/universal-next-action-frontier.candidate.test.mjs \
            tests/application/universal-next-action-intervention.candidate.test.mjs \
            tests/application/universal-next-action-canonical.candidate.test.mjs \
            tests/web/universal-next-action-v2-surface.candidate.test.mjs
      - name: Dual Intelligence reference contract and source-only Graph read overlay
        run: |
          node --test \
            tests/contracts/intelligence-exchange.test.mjs \
            tests/governance/intelligence-reference.test.mjs \
            tests/application/graph-external-intelligence.candidate.test.mjs
      - name: Development mode
        run: echo "PostgreSQL integration, Prisma migration, build and Playwright suites are deferred to manual release checks."


  release-gate:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-gate]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test
      AUTH_SECRET: p6-e2e-auth-secret-2026-blueprint-os-registry
      BLUEPRINT_OWNER_BOOTSTRAP_PROVIDER: github
      BLUEPRINT_OWNER_BOOTSTRAP_SUBJECT: p6-e2e-owner
      BLUEPRINT_ALLOW_LOCAL_HTTP_AUTH: "true"
      RELEASE_GATE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --config prisma7.config.ts

      - name: Migrate empty PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Universal Constitution compliance
        run: pnpm constitution:check

      - name: Constitution authority-set atomicity
        run: node scripts/check-constitution-authority-set.mjs --write artifacts/constitution-authority-set.json

      - name: Constitution ecosystem snapshot
        run: node scripts/check-constitution-ecosystem-snapshot.mjs

      - name: Constitution compliance matrix snapshot
        run: node scripts/check-constitution-compliance-snapshot.mjs

      - name: Generated contract drift
        run: pnpm contracts:check

      - name: Schema compatibility
        run: pnpm schema:compat

      - name: Source-of-truth contradiction gate
        run: pnpm check:truth

      - name: Source-of-truth detector self-test
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=artifacts/source-truth-tests.xml tests/source-truth/source-truth-detector.test.mjs

      - name: Inactive constitutional candidate and adversarial tests
        run: |
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=artifacts/constitution-node-tests.xml tests/source-truth/agent-change-evidence-candidate.test.mjs tests/source-truth/constitution-1.3-candidate.test.mjs tests/source-truth/constitution-contrast.test.mjs
          node scripts/check-constitution-1.3-candidate.mjs --write-evidence

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Unit, contract, authority, and PostgreSQL integration tests
        run: pnpm exec vitest run --passWithNoTests --fileParallelism=false --reporter=default --reporter=json --outputFile.json=artifacts/vitest-results.json

      - name: Production build
        run: pnpm build

      - name: Seed canonical Project Registry E2E data
        run: pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-project-registry.sql

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: App Shell E2E + screenshots
        run: pnpm test:e2e

      - name: Generate exact Release Gate evidence manifest
        run: node scripts/release-gate-evidence.mjs artifacts/release-gate-evidence.json

      - name: Upload Human UX evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence-${{ env.RELEASE_GATE_REVISION }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  # QA-only isolated suite; deliberately NOT a Production or constitutional gate.
  # Enables exactly the 17 opt-in DB tests + one public pinned read that are
  # otherwise SKIPPED in the normal default Vitest suite. The eight restricted
  # GitHub App bridge tests still need distinct authorized App identities.
  optin-evidence-qa:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/foundation/qa-') && contains(github.event.head_commit.message, '[optin-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_qa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_qa_test
      BLUEPRINT_QA_DB_INTEGRATION: "true"
      BLUEPRINT_LIVE_PINNED_SMOKE: "true"
      BLUEPRINT_LIVE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact QA-only commit
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Migrate disposable QA-only PostgreSQL
        run: pnpm db:migrate:deploy
      - name: Verify disposable QA migrations
        run: pnpm db:migrate:status
      - name: Run 17 immutable-postgres and authority opt-in cases
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --fileParallelism=false \
            tests/application/prompt-workflow-qa-pg-integration.test.ts \
            tests/application/prompt-workflow-authority-pg-integration.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=artifacts/optin-postgres-results.json
      - name: Run separate read-only public pinned GitHub byte QA
        run: |
          pnpm exec vitest run --fileParallelism=false \
            tests/application/prompt-workflow-live-inspection.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=artifacts/optin-github-inspection-results.json
      - name: Record exact QA provenance, without conferring Release PASS
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const paths=["artifacts/optin-postgres-results.json","artifacts/optin-github-inspection-results.json"];
            const counts=paths.map(p=>JSON.parse(fs.readFileSync(p,"utf8")));
            if(counts[0].numPassedTests!==17||counts[1].numPassedTests!==1)throw Error("Unexpected test count: independent cases were not verified");
            if(counts.some(v=>v.numFailedTests!==0||v.numPendingTests!==0))throw Error("QA opt-in fail/skip");
            fs.writeFileSync("artifacts/optin-qa-summary.json", JSON.stringify({
              revision:process.env.GITHUB_SHA,treeClaim:"SAME_SOURCE_ONLY_IF_GIT_TREE_COMPARED",
              postgres:17,pinnedPublicGitHubRead:1,privateAppBridge: "BLOCKED_8_NOT_RUN",
              scopedSuccess:true,releaseGatePass:false,productionAuthorized:false
            },null,2)+"\n");
          '
      - name: Upload QA-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optin-qa-evidence-${{ github.sha }}
          path: artifacts/optin-*.json
          if-no-files-found: warn
          retention-days: 14

  # Authorized project-scoped QA of reused PR166 Graph Studio + PR173 Next Action.
  # This is NOT release/publish, and never touches Production credentials.
  graph-next-action-qa:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/foundation/qa-') && contains(github.event.head_commit.message, '[graph-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test
      AUTH_SECRET: p6-e2e-auth-secret-2026-blueprint-os-registry
      BLUEPRINT_OWNER_BOOTSTRAP_PROVIDER: github
      BLUEPRINT_OWNER_BOOTSTRAP_SUBJECT: p6-e2e-owner
      BLUEPRINT_ALLOW_LOCAL_HTTP_AUTH: "true"
      RELEASE_GATE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Apply disposable PostgreSQL migrations
        run: pnpm db:migrate:deploy
      - name: Validate Graph/Workspace TypeScript integration
        run: pnpm typecheck
      - name: Verify reused Graph engine, browser components and shared authorized loader
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --fileParallelism=false \
            tests/application/graph-intelligence.test.ts \
            tests/application/graph-external-intelligence-real-graph.test.ts \
            tests/web/graph-intelligence.test.tsx \
            tests/web/graph-intelligence-server.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=artifacts/graph-integration-vitest.json
      - name: Build exact source for isolated browser E2E
        run: pnpm build
      - name: Seed only temporary project/role data
        run: pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-project-registry.sql
      - name: Install Chromium QA browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Graph Studio + Next Action three-device E2E
        run: pnpm exec playwright test --grep "Graph Studio shares the authenticated" 
      - name: Record graph integration QA source without release claim
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const j=JSON.parse(fs.readFileSync("artifacts/graph-integration-vitest.json","utf8"));
            if(j.numFailedTests!==0||j.numPendingTests!==0||j.numPassedTests<=0) throw Error("Graph Vitest lacks clean proof");
            const browser=JSON.parse(fs.readFileSync("artifacts/playwright-results.json","utf8"));
            if(browser.stats.unexpected!==0||browser.stats.skipped!==0||browser.stats.flaky!==0||browser.stats.expected!==3) throw Error("Three device proof incomplete");
            fs.writeFileSync("artifacts/graph-integration-summary.json", JSON.stringify({
              revision:process.env.GITHUB_SHA,graphTests:j.numPassedTests,browserPass:3,
              runtimeSourceScoped:true,agentExecution:false,canonicalMutation:false,
              releaseGatePass:false,productionAuthorized:false
            },null,2)+"\n");
          '
      - name: Upload scoped QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-ana-qa-evidence-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  # Dedicated exact-revision QA of the real PostgreSQL WorkQuality persistence,
  # NOT a release gate. Distinguishes unique-ID replay and per-record CAS from
  # the *unresolved* project-wide Prompt source-revision transaction gap.
  work-intake-concurrency-qa:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/foundation/qa-') && contains(github.event.head_commit.message, '[work-intake-qa]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test
    steps:
      - name: Checkout exact QA commit
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and disposable migration
        run: |
          pnpm prisma:generate
          pnpm db:migrate:deploy
          pnpm db:migrate:status
      - name: Typecheck exact-source test contract
        run: pnpm typecheck
      - name: Run actual WorkQuality PostgreSQL concurrency regression
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --fileParallelism=false tests/persistence/work-quality-postgres.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=artifacts/work-intake-concurrency.json
      - name: Verify evidence without pretending project-wide CAS passes
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const j=JSON.parse(fs.readFileSync("artifacts/work-intake-concurrency.json","utf8"));
            if(j.numPassedTests!==8||j.numFailedTests!==0||j.numPendingTests!==0)
              throw Error("WorkQuality concurrence test count/failure/skip mismatch");
            fs.writeFileSync("artifacts/work-intake-scoped-conclusion.json", JSON.stringify({
              sha:process.env.GITHUB_SHA,
              postgresTestCases:8,
              uniqueRequestReplay:"OBSERVED_UNIQUE_INDEX",
              conflictingRequest:"OBSERVED_FAIL_CLOSED",
              perRecordUpdateCAS:"OBSERVED_PASS",
              projectWidePromptSourceCAS:"NOT_IMPLEMENTED_UNVERIFIED",
              releaseGatePass:false,productionAuthorized:false
            },null,2)+"\n");
          '
      - name: Upload exact QA-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: work-intake-qa-${{ github.sha }}
          path: artifacts/work-intake-*.json
          if-no-files-found: warn
          retention-days: 14

  # C40: public-runner, source-pinned QA only for the constitutional assistant
  # on the existing Draft PR173 branch. No release or Production authority.
  constitutional-assistant-qa:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'proposal/constitutional-graph-integration-20261122' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test
      AUTH_SECRET: p6-e2e-auth-secret-2026-blueprint-os-registry
      BLUEPRINT_OWNER_BOOTSTRAP_PROVIDER: github
      BLUEPRINT_OWNER_BOOTSTRAP_SUBJECT: p6-e2e-owner
      BLUEPRINT_ALLOW_LOCAL_HTTP_AUTH: "true"
    steps:
      - name: Check out exact proposed PR HEAD
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact tested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "CONSTITUTIONAL_SUPPORT_QA_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CONSTITUTIONAL_SUPPORT_QA_SOURCE=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client and migrate disposable PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm db:migrate:deploy
      - name: Run canonical source prompt builder and component SSR tests
        run: |
          node --test tests/web/constitutional-prompt-builder.candidate.test.mjs tests/web/constitutional-navigation-support.standard.test.mjs
          pnpm exec vitest run --config tests/web/workflow-studio.vitest.config.mts tests/web/universal-next-action-v2.test.tsx
      - name: Typecheck and build Next.js from exact source
        run: |
          pnpm --filter @blueprint-os/web typecheck
          pnpm build
      - name: Seed disposable canonical role/project fixtures
        run: pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-project-registry.sql
      - name: Install Playwright Chromium on free standard runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Authenticated desktop/tablet/mobile prompt panel acceptance
        run: |
          mkdir -p artifacts
          pnpm exec playwright test --grep "Pinned constitutional prompt support follows owner P0/P1 direction"
      - name: Verify three-device QA and no release authority
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("artifacts/playwright-results.json","utf8"));
            if(p.stats.unexpected!==0 || p.stats.skipped!==0 || p.stats.flaky!==0 || p.stats.expected!==3) throw Error("Expected exact 3-device Chromium pass, no skips/failures");
            console.log(JSON.stringify({sourceHead:process.env.CONSTITUTIONAL_SUPPORT_QA_SOURCE,chromiumPassed:3,releaseAuthorized:false,productionChanged:false}));
          '
      - name: Upload synthetic constitutional support screenshots (QA only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constitutional-support-screenshots-${{ github.event.pull_request.head.sha }}
          path: artifacts/constitutional-support-*.png
          if-no-files-found: warn
          retention-days: 1
