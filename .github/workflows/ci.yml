name: Development Fast CI

on:
  push:
    branches: [main, "foundation/**", "phase6/**", "phase7/**", "phase8/**", "phase9/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f prisma7.config.ts
          test -f packages/persistence/prisma/schema.prisma
          test -d apps
          test -d packages/persistence/prisma/migrations
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Universal Constitution compliance
        run: node scripts/check-constitution-adoption.mjs
      - name: Constitution authority-set atomicity
        run: node scripts/check-constitution-authority-set.mjs

      - name: Constitution ecosystem snapshot
        run: node scripts/check-constitution-ecosystem-snapshot.mjs

      - name: Constitution compliance matrix snapshot
        run: node scripts/check-constitution-compliance-snapshot.mjs

      - name: Derive current governed inventory without changing sealed baseline
        run: |
          node scripts/derive-governance-current-view.mjs --check
          node --test tests/governance/current-coverage.test.mjs
      - name: Test scoped live GitHub verification fail-closed
        run: node --test tests/governance/onboarding-live.test.mjs
      - name: Sealed constitution onboarding queue
        run: |
          node scripts/check-governance-onboarding-queue.mjs
          node --test tests/governance/onboarding-queue.test.mjs
      - name: Execution departments ownership and split policy
        run: |
          node scripts/check-execution-departments.mjs
          node --test tests/governance/execution-departments.test.mjs
      - name: Source-of-truth contradiction gate
        run: node scripts/check-source-of-truth.mjs
      - name: Source-of-truth detector self-test
        run: node --test tests/source-truth/source-truth-detector.test.mjs
      - name: Agent change evidence candidate adversarial self-tests (proposal only)
        run: node --test tests/source-truth/agent-change-evidence-candidate.test.mjs
      - name: Inactive constitutional candidate and contrast negative tests
        run: |
          node --test tests/source-truth/constitution-1.3-candidate.test.mjs tests/source-truth/constitution-contrast.test.mjs
          node scripts/check-constitution-1.3-candidate.mjs
      - name: Central prompt workflow contract validation
        run: node scripts/check-prompt-workflows.mjs
      - name: Central prompt workflow adversarial regression
        run: node --test tests/prompt-workflows/workflow.test.mjs
      - name: Development mode
        run: echo "PostgreSQL integration, Prisma migration, build and Playwright suites are deferred to manual release checks."


  release-gate:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-gate]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test
      AUTH_SECRET: p6-e2e-auth-secret-2026-blueprint-os-registry
      BLUEPRINT_OWNER_BOOTSTRAP_PROVIDER: github
      BLUEPRINT_OWNER_BOOTSTRAP_SUBJECT: p6-e2e-owner
      BLUEPRINT_ALLOW_LOCAL_HTTP_AUTH: "true"
      RELEASE_GATE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --config prisma7.config.ts

      - name: Migrate empty PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Universal Constitution compliance
        run: pnpm constitution:check

      - name: Constitution authority-set atomicity
        run: node scripts/check-constitution-authority-set.mjs --write artifacts/constitution-authority-set.json

      - name: Constitution ecosystem snapshot
        run: node scripts/check-constitution-ecosystem-snapshot.mjs

      - name: Constitution compliance matrix snapshot
        run: node scripts/check-constitution-compliance-snapshot.mjs

      - name: Generated contract drift
        run: pnpm contracts:check

      - name: Schema compatibility
        run: pnpm schema:compat

      - name: Source-of-truth contradiction gate
        run: pnpm check:truth

      - name: Source-of-truth detector self-test
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=artifacts/source-truth-tests.xml tests/source-truth/source-truth-detector.test.mjs

      - name: Inactive constitutional candidate and adversarial tests
        run: |
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=artifacts/constitution-node-tests.xml tests/source-truth/agent-change-evidence-candidate.test.mjs tests/source-truth/constitution-1.3-candidate.test.mjs tests/source-truth/constitution-contrast.test.mjs
          node scripts/check-constitution-1.3-candidate.mjs --write-evidence

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Unit, contract, authority, and PostgreSQL integration tests
        run: pnpm exec vitest run --passWithNoTests --fileParallelism=false --reporter=default --reporter=json --outputFile.json=artifacts/vitest-results.json

      - name: Production build
        run: pnpm build

      - name: Seed canonical Project Registry E2E data
        run: pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-project-registry.sql

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: App Shell E2E + screenshots
        run: pnpm test:e2e

      - name: Generate exact Release Gate evidence manifest
        run: node scripts/release-gate-evidence.mjs artifacts/release-gate-evidence.json

      - name: Upload Human UX evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence-${{ env.RELEASE_GATE_REVISION }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
