name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies for FND-006 workspace bootstrap
        run: pnpm install --no-frozen-lockfile

      - name: Bootstrap lockfile evidence
        run: |
          echo "===BLUEPRINT_PNPM_LOCKFILE_BEGIN==="
          cat pnpm-lock.yaml
          echo "===BLUEPRINT_PNPM_LOCKFILE_END==="

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --config prisma7.config.ts

      - name: Migrate empty PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Generated contract drift
        run: pnpm contracts:check

      - name: Schema compatibility
        run: pnpm schema:compat

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Unit, contract, authority, and PostgreSQL integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
