name: Development Fast CI

on:
  push:
    branches: [main, "foundation/**", "phase6/**", "phase7/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f prisma7.config.ts
          test -d prisma
          test -d app
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Development mode
        run: echo "PostgreSQL integration, Prisma migration, build and Playwright suites are deferred to manual release checks."
