name: Unified Next Action Candidate CI (not Work E2E)
on:
  pull_request:
    paths:
      - "packages/application/src/unified-next-action.ts"
      - "packages/application/src/index.ts"
      - "apps/web/app/projects/[projectId]/_components/readiness-overview.tsx"
      - "apps/web/app/projects/[projectId]/actions.ts"
      - "apps/web/app/projects/[projectId]/page.tsx"
      - "control/unified-next-action.candidate.v1.json"
      - "packages/runtime/src/next-action-inspection-adapter.ts"
      - "packages/runtime/src/index.ts"
      - "packages/runtime/src/next-action-inspection-adapter.ts"
      - "packages/runtime/src/workflow-inspection-pipeline.ts"
      - "tests/application/prompt-workflow-inspection-pipeline.test.ts"
      - "tests/application/prompt-workflow-operational-e2e.test.ts"
      - "tests/application/unified-next-action-execution.test.ts"
      - "tests/application/unified-next-action-binding-pg-integration.test.ts"
      - "packages/persistence/src/next-action-work-binding-repository.ts"
      - "scripts/check-local-e2e-authority.mjs"
      - "tests/tooling/local-e2e-authority-preflight.test.mjs"
      - "packages/persistence/prisma/schema.prisma"
      - "packages/persistence/prisma/migrations/20261017110000_next_action_work_binding/**"
      - "packages/application/src/next-action-blueprint.candidate.ts"
      - "packages/application/src/next-action-run-plan.candidate.ts"
      - "apps/web/app/projects/[projectId]/_components/project-next-action-runner.tsx"
      - "apps/web/app/projects/[projectId]/_components/project-action-guidance.tsx"
      - "tests/application/next-action-blueprint.candidate.test.ts"
      - "tests/application/next-action-run-plan.candidate.test.ts"
      - "tests/application/next-action-assistance.candidate.test.ts"
      - "tests/web/r33-one-click-cmd-feedback.candidate.test.ts"
      - "tests/web/r33-one-click-server-integration.candidate.test.ts"
      - "tests/e2e/r33-next-action-browser.pw.ts"
      - "scripts/e2e-r33-viewer-fixture.sql"
      - "packages/persistence/scripts/r33-disposable-browser-fixture.mjs"
      - "tests/application/unified-next-action.test.ts"
      - "docs/UNIFIED-NEXT-ACTION-WORK-HANDOFF.candidate.md"
      - ".github/workflows/unified-next-action-candidate.yml"
permissions:
  contents: read
jobs:
  focused-next-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact dependencies and generate types
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
      - name: Vitest — authenticated action mocks, canonical CMD, R33 plan and UI wiring
        run: |
          pnpm exec vitest run \
            tests/application/unified-next-action.test.ts \
            tests/application/unified-next-action-execution.test.ts \
            tests/application/prompt-workflow-inspection-pipeline.test.ts \
            tests/application/prompt-workflow-operational-e2e.test.ts \
            tests/application/next-action-blueprint.candidate.test.ts \
            tests/application/next-action-run-plan.candidate.test.ts \
            tests/application/next-action-assistance.candidate.test.ts \
            tests/web/r33-one-click-cmd-feedback.candidate.test.ts \
            tests/web/r33-one-click-server-integration.candidate.test.ts
      - name: Lint R33 scoped candidate source and regression suites
        run: |
          pnpm exec eslint packages/application/src/next-action-blueprint.candidate.ts packages/application/src/next-action-run-plan.candidate.ts \
            packages/runtime/src/next-action-inspection-adapter.ts \
            'apps/web/app/projects/[projectId]/_components/project-next-action-runner.tsx' \
            tests/application/next-action-blueprint.candidate.test.ts tests/application/next-action-run-plan.candidate.test.ts \
            tests/application/next-action-assistance.candidate.test.ts \
            tests/web/r33-one-click-cmd-feedback.candidate.test.ts tests/web/r33-one-click-server-integration.candidate.test.ts
      - name: Read-only local E2E authority provenance preflight regression (no credentials)
        run: node --test tests/tooling/local-e2e-authority-preflight.test.mjs
      - name: Typecheck application and Next project Overview
        run: |
          pnpm --filter @blueprint-os/application typecheck
          pnpm --filter @blueprint-os/runtime typecheck
          pnpm --filter @blueprint-os/web typecheck
      - name: Mark real executor and Work session E2E not verified
        run: echo "PASS means contract + UI + server-action types; NOT authenticated browser E2E, Work host or real executor."
  canonical-binding-postgres:
    name: Disposable PostgreSQL binding authority and immutable readback
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_next_action_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_next_action_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_next_action_test
      BLUEPRINT_QA_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build canonical Prisma schema only on disposable DB
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm exec prisma validate --config prisma7.config.ts
          pnpm db:migrate:deploy
          pnpm db:migrate:status
      - name: Exercise real PostgreSQL owner/adoption/binding revocation constraints
        run: pnpm exec vitest run tests/application/unified-next-action-binding-pg-integration.test.ts
      - name: Explicit non-acceptance of runtime executor
        run: echo "Disposable PostgreSQL binding decision tests, NOT authenticated Work runner E2E or owner approval."

  isolated-browser-r33:
    name: Disposable local Browser QA — synthetic sessions, NOT human login
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: blueprint
          POSTGRES_DB: blueprint_r33_browser_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint -d blueprint_r33_browser_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://blueprint:blueprint@localhost:5432/blueprint_r33_browser_qa
      AUTH_SECRET: r33-disposable-browser-test-only-secret-not-for-live
      BLUEPRINT_OWNER_BOOTSTRAP_PROVIDER: github
      BLUEPRINT_OWNER_BOOTSTRAP_SUBJECT: p6-e2e-owner
      BLUEPRINT_ALLOW_LOCAL_HTTP_AUTH: "true"
      BLUEPRINT_QA_EXACT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin source and prove isolated test scope
        run: |
          test "$(git rev-parse HEAD)" = "$BLUEPRINT_QA_EXACT_SHA"
          echo "QA_SOURCE_SHA=$BLUEPRINT_QA_EXACT_SHA"
          echo "SYNTHETIC_QA_ACTORS_ONLY=true"
          echo "PRODUCTION_RELEASE_AUTHORITY=false"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install source-pinned dependencies and migrate disposable DB
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm db:migrate:deploy
          pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-project-registry.sql
          pnpm exec prisma db execute --config prisma7.config.ts --file scripts/e2e-r33-viewer-fixture.sql
      - name: Build actual Next application at this source SHA
        run: pnpm build
      - name: Install ephemeral Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E (actual Next and PostgreSQL, synthetic signed QA principals)
        run: |
          mkdir -p artifacts
          pnpm exec playwright test tests/e2e/r33-next-action-browser.pw.ts --project=desktop-chromium
      - name: Capture non-production browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r33-isolated-browser-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
